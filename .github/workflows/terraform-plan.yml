name: terraform-plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: 1.15.8
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_azs: ${{ vars.TF_AZS }}
  TF_VAR_kubernetes_version: ${{ vars.TF_KUBERNETES_VERSION }}
  TF_VAR_cluster_admin_arns: ${{ vars.TF_CLUSTER_ADMIN_ARNS }}
  TF_VAR_admin_cidrs: ${{ secrets.TF_ADMIN_CIDRS }}
  TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}

jobs:
  static:
    name: fmt-validate-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (all environments)
        run: |
          for d in envs/dev envs/staging envs/prod; do
            echo "== $d"
            (cd "$d" && terraform init -backend=false -input=false > /dev/null && terraform validate)
          done

      - name: IaC misconfiguration scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    name: plan-${{ matrix.env }}
    needs: static
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=cloud-lab-platform-tfstate-510490942608" \
            -backend-config="key=envs/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          exit $code

      - name: Post plan to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ENV: ${{ matrix.env }}
        run: |
          [ -f plan.txt ] || echo "Plan did not run; see the workflow logs." > plan.txt
          SUMMARY=$(grep -E "^(Plan:|No changes\.|Error:)" plan.txt | head -1 || true)
          {
            echo "### Terraform plan: \`$ENV\`"
            echo
            echo "**${SUMMARY:-See the workflow logs.}**"
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo "</details>"
            echo
            echo "<!-- tfplan:$ENV -->"
          } > comment.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"<!-- tfplan:$ENV -->\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
