# Every connection goes through AWS Systems Manager: no SSH, no port 22, no keys.
ansible_connection: amazon.aws.aws_ssm
ansible_aws_ssm_region: us-east-1
ansible_aws_ssm_bucket_name: "cloud-lab-platform-{{ ec2_tags.Environment }}-ssm-transfer-510490942608"
ansible_python_interpreter: /usr/bin/python3
